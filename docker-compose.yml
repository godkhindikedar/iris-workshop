services:

  # Workbench
  workbench:
    image: nginx:alpine
    container_name: workshop-workbench
    ports:
      - "80:80"
    volumes:
      - ./workbench:/usr/share/nginx/html:ro
      - ./workbench/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./workbench/proxy:/etc/nginx/proxy:ro
    depends_on:
      - docs
      - vscode
      - web
      - backend
      - redisinsight

  # Documentation server (Docsify)
  docs:
    image: nginx:alpine
    container_name: workshop-docs
    volumes:
      - ./docs:/usr/share/nginx/html:ro

  # VS Code in the browser (code-server)
  vscode:
    image: codercom/code-server:latest
    container_name: workshop-vscode
    volumes:
      - ./code:/home/coder/code
      - vscode-data:/home/coder/.local/share/code-server
    command: >-
      --auth none
      --bind-addr 0.0.0.0:8080
      --disable-workspace-trust
      --trusted-origins "*"
      /home/coder/code

  # Iris frontend (Vite) + web terminal (ttyd/tmux)
  # restart: unless-stopped ensures the container restarts if someone types
  # "exit" in the terminal, which would otherwise stop the tmux session
  web:
    build: ./docker/web
    container_name: workshop-web
    restart: unless-stopped
    environment:
      - VITE_BASE_PATH=/app/
      - VITE_USE_POLLING=1
    volumes:
      - ./code:/code
      - /code/iris/frontend/node_modules
      - iris-venv:/opt/venv
      - uv-cache:/root/.cache/uv
      # Local embedding model (downloaded once on first use)
      - hf-cache:/root/.cache/huggingface

  # Iris backend (FastAPI + LangGraph agent), reached through the workbench at /api/
  backend:
    build: ./docker/web
    container_name: workshop-backend
    restart: unless-stopped
    command: /backend.sh
    volumes:
      - ./code:/code
      # Google service account key for Gemini on Vertex AI (put gcp-key.json in ./secrets)
      - ./secrets:/run/secrets:ro
      - iris-venv:/opt/venv
      - uv-cache:/root/.cache/uv
      # Local embedding model (downloaded once on first use)
      - hf-cache:/root/.cache/huggingface

  # Redis
  redis:
    image: redis:latest
    container_name: workshop-redis

  # Redis Insight
  redisinsight:
    image: redis/redisinsight:latest
    container_name: workshop-redisinsight
    environment:
      - RI_PROXY_PATH=/redisinsight
    # No database is pre-configured: the Iris demo uses the Redis database from
    # code/iris/.env (not the local `redis` container), so attendees add that
    # connection themselves (see docs/tasks/task-2.md).
    volumes:
      - redisinsight-data:/data

volumes:
  iris-venv:
  uv-cache:
  hf-cache:
  vscode-data:
  redisinsight-data:
